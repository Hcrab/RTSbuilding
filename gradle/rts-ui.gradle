                        "NeoForge dev mod '${mod_id}' missing source set '${required}': ${registered}")
            }
        }
        println "Verified NeoForge dev mod sources: ${registered.sort()}"
    }
}

tasks.register('verifyUiStyleDebt') {
    group = 'verification'
    description = '锁定通用 ARGB、重复布局偏移与正式按钮手绘债务，确保后续只减不增。'
    def productionRoots = [
            'src/main/java/com/rtsbuilding/rtsbuilding/client/screen/topbar',
            'src/main/java/com/rtsbuilding/rtsbuilding/client/screen/panel',
            'src/main/java/com/rtsbuilding/rtsbuilding/client/screen/quickbuild',
            'src/main/java/com/rtsbuilding/rtsbuilding/client/screen/blueprint',
            'src/main/java/com/rtsbuilding/rtsbuilding/client/screen/gear',
            'src/main/java/com/rtsbuilding/rtsbuilding/client/screen/guide',
            'src/main/java/com/rtsbuilding/rtsbuilding/client/screen/storage',
            'src/main/java/com/rtsbuilding/rtsbuilding/client/screen/workflow',
            'src/main/java/com/rtsbuilding/rtsbuilding/client/screen/craft',
            'src/main/java/com/rtsbuilding/rtsbuilding/client/widget'
    ]
    def productionSources = files(productionRoots.collect { fileTree(it) { include '**/*.java' } },
            file('src/main/java/com/rtsbuilding/rtsbuilding/client/util/RtsClientUiUtil.java'),
            file('src/main/java/com/rtsbuilding/rtsbuilding/client/screen/standalone/RtsPluginManagementScreen.java'))
    def previewSources = fileTree('src/uiPreview/java') { include '**/*.java' }
    def productionScreenSources =
            fileTree('src/main/java/com/rtsbuilding/rtsbuilding/client/screen') { include '**/*.java' }
    def productionOverlaySources = files(
            fileTree('src/main/java/com/rtsbuilding/rtsbuilding/client/input/overlay') {
                include '**/*.java'
            },
            file('src/main/java/com/rtsbuilding/rtsbuilding/client/input/RtsClientInputGate.java'),
            file('src/main/java/com/rtsbuilding/rtsbuilding/client/popup/RtsCraftQuantityDialog.java'),
            file('src/main/java/com/rtsbuilding/rtsbuilding/client/popup/RtsCraftFeedbackPopup.java'))
    // 颜色门禁覆盖整个生产 screen 包和已经收口的容器 Overlay/Popup；不能靠文件白名单制造局部零债务。
    def productionColorSources = files(
            productionSources, productionScreenSources, productionOverlaySources)
    def iconRenderer = file('src/main/java/com/rtsbuilding/rtsbuilding/client/screen/topbar/TopBarIconRenderer.java')
    def guidePanel = file('src/main/java/com/rtsbuilding/rtsbuilding/client/screen/guide/GuidePanel.java')
    inputs.files(productionSources, productionColorSources, previewSources,
            productionScreenSources, productionOverlaySources, iconRenderer, guidePanel)
    doLast {
        def argb = ~/0x[0-9A-Fa-f]{8}/
        int productionArgb = productionColorSources.files.sum { source ->
            (source.getText('UTF-8') =~ argb).count
        } as int
        def rgb = ~/0x[0-9A-Fa-f]{6}(?![0-9A-Fa-f])/
        int productionRgb = productionColorSources.files.sum { source ->
            (source.getText('UTF-8') =~ rgb).count
        } as int
        int previewArgb = previewSources.files.sum { source ->
            (source.getText('UTF-8') =~ argb).count
        } as int
        // 2026-07-24：生产颜色已经全部迁到 Kit 主题边界；预览仅保留诊断/差异图专用色。
        int productionArgbLimit = 0
        int previewArgbLimit = 31
        int productionRgbLimit = 0
        if (productionArgb > productionArgbLimit || productionRgb > productionRgbLimit
                || previewArgb > previewArgbLimit) {
            throw new GradleException(
                    "UI color debt grew: production ARGB=${productionArgb}/${productionArgbLimit}, " +
                    "production RGB=${productionRgb}/${productionRgbLimit}, " +
                    "preview=${previewArgb}/${previewArgbLimit}")
        }
        // 2026-07-23 Craft/蓝图/设置二次收口后的债务水位；主题文件本身不在扫描范围内。
        // 插件管理页已纳入生产扫描；它的色值已全部迁入 Kit 语义色板。
        def layoutLiteral = ~/\b(?:x|y|w|h|width|height|mouseX|mouseY)\s*[+-]\s*\d+/
        int layoutDebt = productionSources.files.sum { source ->
            (source.getText('UTF-8') =~ layoutLiteral).count
        } as int
        int layoutDebtLimit = 0
        if (layoutDebt > layoutDebtLimit) {
            throw new GradleException(
                    "UI layout literal debt grew: ${layoutDebt}/${layoutDebtLimit}")
        }
        // GUI 矩形统一采用 Core 的半开语义；世界方块/AABB 的闭区间不在此规则范围。
        def closedPointerHit = ~/(?s)mouseX\s*>=\s*x\s*&&\s*mouseX\s*<=\s*x\s*\+\s*w.*?mouseY\s*>=\s*y\s*&&\s*mouseY\s*<=\s*y\s*\+\s*h/
        def productionPointerSources = files(
                productionScreenSources, productionOverlaySources)
        int closedPointerHitDebt = productionPointerSources.files.sum { source ->
            (source.getText('UTF-8') =~ closedPointerHit).count
        } as int
        if (closedPointerHitDebt != 0) {
            throw new GradleException(
                    "Closed-boundary UI pointer hit tests returned: ${closedPointerHitDebt}/0")
        }
        int legacyFrameDebt = productionColorSources.files.sum { source ->
            source.getText('UTF-8').count('RtsClientUiUtil.drawPanelFrame(')
        } as int
        if (legacyFrameDebt != 0) {
            throw new GradleException(
                    "Legacy production UI frame helper returned: ${legacyFrameDebt}/0")
        }
        // 水平线仍可表达章节分隔；生产 UI 的垂直线只曾用于私有手写框体，现统一由 Kit primitive 接管。
        int directVerticalLineDebt = productionColorSources.files.sum { source ->
            source.getText('UTF-8').count('.vLine(')
        } as int
        if (directVerticalLineDebt != 0) {
            throw new GradleException(
                    "Direct production UI vertical-line chrome returned: ${directVerticalLineDebt}/0")
        }
        String topbar = iconRenderer.getText('UTF-8')
        ['.fill(', '.hLine(', '.vLine(', '.drawString('].each { forbidden ->
            if (topbar.contains(forbidden)) {
                throw new GradleException("Formal top-bar icons must be texture-only: ${forbidden}")
            }
        }
        String guide = guidePanel.getText('UTF-8')
        int iconStart = guide.indexOf('private void drawTopicIcon')
        int iconEnd = guide.indexOf('private void drawGuideTextureIcon', iconStart)
        if (iconStart < 0 || iconEnd < 0) {
            throw new GradleException('Guide icon texture boundary is missing')
        }
        String guideIconPath = guide.substring(iconStart, iconEnd)
        ['.fill(', '.hLine(', '.vLine(', '.drawString('].each { forbidden ->
            if (guideIconPath.contains(forbidden)) {
                throw new GradleException("Formal guide icons must be texture-only: ${forbidden}")
            }
        }
        println "UI style debt: production ARGB ${productionArgb}/${productionArgbLimit}, " +
                "production RGB ${productionRgb}/${productionRgbLimit}, " +
                "preview ARGB ${previewArgb}/${previewArgbLimit}, " +
                "layout literals ${layoutDebt}/${layoutDebtLimit}, " +
                "closed pointer hits ${closedPointerHitDebt}/0, formal hand-drawn icons 0"
        println "UI chrome debt: legacy production UI frame helper ${legacyFrameDebt}/0, " +
                "direct vertical-line chrome ${directVerticalLineDebt}/0"
    }
}

tasks.register('verifyUiIconResources') {
    group = 'verification'
    description = '核对正式按钮纹理路径、尺寸、透明通道、四状态和资产来源记录。'
    def topbarIds = [
            'mode_interact', 'mode_link', 'mode_funnel', 'mode_rotate',
            'quick_build', 'quest_detect', 'chunk_view', 'filter_block',
            'guide', 'developer', 'settings_gear'
    ]
    def states = ['inactive', 'hover', 'active', 'pressed']
    def topbarTextures = topbarIds.collectMany { id -> states.collect { state ->
        file("src/main/resources/assets/rtsbuilding/textures/gui/topbar/${id}_${state}.png")
    } }
    def guideTextures = ['search', 'sort', 'clock', 'droplet', 'pin', 'craft', 'slider', 'toggle'].collect {
        file("src/main/resources/assets/rtsbuilding/textures/gui/guide/${it}.png")
    }
    def pr133Keys = [
            'ball', 'chain', 'cube', 'cylinder', 'line', 'round', 'single', 'surface', 'wall',
            'fill_water/cave', 'fill_water/lake', 'smart_break/stair', 'smart_break/tree'
    ]
    def pr133LegacyStates = pr133Keys.collectMany { key -> states.collect { state ->
        file("src/main/resources/assets/rtsbuilding/textures/gui/quickbuild_pr133/${key}_${state}.png")
    } }
    def pr133PaletteSources = pr133Keys.collect { key ->
        file("src/main/resources/assets/rtsbuilding/textures/gui/new_2nd_icons/${key}.png")
    }
    def paletteTopbarSources = topbarIds.collect { id ->
        file("src/main/resources/assets/rtsbuilding/textures/gui/topbar/${id}_hover.png")
    }
    def defaultButtonTemplate = file(
            'src/main/resources/assets/rtsbuilding/textures/gui/general/default_button.png')
    def modeButtonTemplate = file(
            'src/main/resources/assets/rtsbuilding/textures/gui/general/mode_button.png')
    def terminalTexture = file(
            'src/main/resources/assets/rtsbuilding/textures/gui/ui/terminal.png')
    def terminalButtonTemplate = file(
            'src/main/resources/assets/rtsbuilding/textures/gui/ui/terminal_button.png')
    def terminalSortButtonBase = file(
            'src/uiPreview/resources/v2-sort/terminal_sort_button_base.png')
    def v2SortSource = file('src/uiPreview/resources/v2-sort/sort.png')
    def v2SortOrderSource = file('src/uiPreview/resources/v2-sort/sort_order.png')
    def terminalSortButtons = [
            'name', 'quantity', 'ascending', 'descending'
    ].collect { semantic ->
        file("src/main/resources/assets/rtsbuilding/textures/gui/ui/terminal_sort_${semantic}.png")
    }
    def colorPickerTextures = [
            file('src/main/resources/assets/rtsbuilding/textures/gui/color/colorwheel.png'),
            file('src/main/resources/assets/rtsbuilding/textures/gui/color/color_palette_indicator.png')
    ]
    def assetLicenses = file('ASSET-LICENSES.md')
    inputs.files(topbarTextures + guideTextures + pr133LegacyStates
            + pr133PaletteSources + paletteTopbarSources + colorPickerTextures
            + [defaultButtonTemplate, modeButtonTemplate,
               terminalTexture, terminalButtonTemplate, terminalSortButtonBase,
               v2SortSource, v2SortOrderSource, assetLicenses] + terminalSortButtons)
    doLast {
        (topbarTextures + guideTextures).each { texture ->
            if (!texture.isFile() || texture.length() == 0L) {
                throw new GradleException("Missing formal UI icon texture: ${texture}")
            }
            def image = javax.imageio.ImageIO.read(texture)
            if (image == null) throw new GradleException("Unreadable UI icon texture: ${texture}")
            int expected = texture.parentFile.name == 'topbar' ? 24 : 18
            if (image.width != expected || image.height != expected || !image.colorModel.hasAlpha()) {
                throw new GradleException(
                        "Invalid UI icon ${texture}: ${image.width}x${image.height}, alpha=${image.colorModel.hasAlpha()}")
            }
        }
        (pr133LegacyStates + pr133PaletteSources + paletteTopbarSources).each { texture ->
            if (!texture.isFile() || texture.length() == 0L) {
                throw new GradleException("Missing dual-track UI texture: ${texture}")
            }
            def image = javax.imageio.ImageIO.read(texture)
            if (image == null || image.width != 24 || image.height != 24) {
                throw new GradleException("Invalid PR #133 UI texture size: ${texture}")
            }
        }
        def expectedColorPickerSizes = [
                'colorwheel.png': [89, 89],
                'color_palette_indicator.png': [144, 216]
        ]
        colorPickerTextures.each { texture ->
            if (!texture.isFile() || texture.length() == 0L) {
                throw new GradleException("Missing v2 color-picker texture: ${texture}")
            }
            def image = javax.imageio.ImageIO.read(texture)
            def expected = expectedColorPickerSizes[texture.name]
            if (image == null || image.width != expected[0] || image.height != expected[1]
                    || !image.colorModel.hasAlpha()) {
                throw new GradleException("Invalid v2 color-picker texture: ${texture}")
            }
        }
        def allowedPaletteColors = [0xFF445468 as int, 0xFF1A202A as int, 0xFFA6CCF2 as int] as Set
        def questPaletteColors = allowedPaletteColors + [
                0xFF7CE478 as int, 0xFF0C2612 as int,
                0xFFECA2A2 as int, 0xFF332323 as int
        ]
        (pr133PaletteSources + paletteTopbarSources).each { texture ->
            def image = javax.imageio.ImageIO.read(texture)
            def unknown = new LinkedHashSet<Integer>()
            def allowed = texture.name.startsWith('quest_detect')
                    ? questPaletteColors : allowedPaletteColors
            for (int y = 0; y < image.height; y++) {
                for (int x = 0; x < image.width; x++) {
                    int argb = image.getRGB(x, y)
                    if (((argb >>> 24) != 0) && !allowed.contains(argb)) unknown.add(argb)
                }
            }
            if (!unknown.isEmpty()) {
                throw new GradleException("Unknown Palette index colors in ${texture}: ${unknown}")
            }
        }
        def defaultButton = javax.imageio.ImageIO.read(defaultButtonTemplate)
        if (defaultButton == null || defaultButton.width != 4 || defaultButton.height != 16) {
            throw new GradleException(
                    "Legacy default-button template must remain 4x16: ${defaultButtonTemplate}")
        }
        def expectedButtonColors = [
                0xFF536679, 0xFF222A34, 0xFF202732, 0xFF0D1015,
                0xFFA6CCF2, 0xFF445468, 0xFF404E64, 0xFF1A202A,
                0xFF3E723C, 0xFF163117, 0xFF112E16, 0xFF061309,
                0xFF7CE478, 0xFF2C622E, 0xFF225C2C, 0xFF0C2612
        ].collect { it as int } as Set
        def actualButtonColors = new LinkedHashSet<Integer>()
        for (int y = 0; y < defaultButton.height; y++) {
            for (int x = 0; x < defaultButton.width; x++) {
                actualButtonColors.add(defaultButton.getRGB(x, y))
            }
        }
        if (actualButtonColors != expectedButtonColors) {
            throw new GradleException(
                    "Legacy default-button palette topology changed: ${actualButtonColors}")
        }
        def modeButton = javax.imageio.ImageIO.read(modeButtonTemplate)
        if (modeButton == null || modeButton.width != 512 || modeButton.height != 1536) {
            throw new GradleException(
                    "Legacy mode-button template must remain 512x1536: ${modeButtonTemplate}")
        }
        def expectedModeButtonColors = [
                0xFF54616E, 0xFF0D1117, 0xFF788C9F, 0xFF363F47,
                0xFF7E91A5, 0xFFB4D2EE, 0xFFB3FF9C, 0xFF536679,
                0xFFE0FFDA, 0xFF72BA70, 0xFFDAFFDC
        ].collect { it as int } as Set
        def actualModeButtonColors = new LinkedHashSet<Integer>()
        for (int y = 0; y < modeButton.height; y++) {
            for (int x = 0; x < modeButton.width; x++) {
                int argb = modeButton.getRGB(x, y)
                if ((argb >>> 24) != 0) actualModeButtonColors.add(argb)
            }
        }
        if (actualModeButtonColors != expectedModeButtonColors) {
            throw new GradleException(
                    "Legacy mode-button palette topology changed: ${actualModeButtonColors}")
        }
        def terminal = javax.imageio.ImageIO.read(terminalTexture)
        def terminalButton = javax.imageio.ImageIO.read(terminalButtonTemplate)
        if (terminal == null || terminalButton == null
                || terminalButton.width != 15 || terminalButton.height != 13) {
            throw new GradleException(
                    "Contributor terminal button must remain an exact 15x13 crop: ${terminalButtonTemplate}")
        }
        def expectedTerminalButtonColors = [
                0xFF536679, 0xFF324153, 0xFF1A202A
        ].collect { it as int } as Set
        def actualTerminalButtonColors = new LinkedHashSet<Integer>()
        for (int y = 0; y < terminalButton.height; y++) {
            for (int x = 0; x < terminalButton.width; x++) {
                int actual = terminalButton.getRGB(x, y)
                int contributor = terminal.getRGB(197 + x, 2 + y)
                if (actual != contributor) {
                    throw new GradleException(
                            "Terminal button drifted from PR #133 source at ${x},${y}")
                }
                actualTerminalButtonColors.add(actual)
            }
        }
        if (actualTerminalButtonColors != expectedTerminalButtonColors) {
            throw new GradleException(
                    "Contributor terminal-button palette changed: ${actualTerminalButtonColors}")
        }
        def terminalSortBase = javax.imageio.ImageIO.read(terminalSortButtonBase)
        if (terminalSortBase == null
                || terminalSortBase.width != 24
                || terminalSortBase.height != 24) {
            throw new GradleException(
                    "Terminal sort base must remain a prebuilt 24x24 development texture: ${terminalSortButtonBase}")
        }
        def actualSortBaseColors = new LinkedHashSet<Integer>()
        for (int y = 0; y < terminalSortBase.height; y++) {
            int sourceY = y == 0 ? 0 : y == 23 ? 12
                    : 1 + (int) Math.floor(((y - 1) * 11) / 22.0D)
            for (int x = 0; x < terminalSortBase.width; x++) {
                int sourceX = x == 0 ? 0 : x == 23 ? 14
                        : 1 + (int) Math.floor(((x - 1) * 13) / 22.0D)
                int actual = terminalSortBase.getRGB(x, y)
                int expected = terminalButton.getRGB(sourceX, sourceY)
                if (actual != expected) {
                    throw new GradleException(
                            "Prebuilt 24x24 terminal sort base drifted at ${x},${y}")
                }
                actualSortBaseColors.add(actual)
            }
        }
        if (actualSortBaseColors != expectedTerminalButtonColors) {
            throw new GradleException(
                    "Prebuilt terminal sort-base palette changed: ${actualSortBaseColors}")
        }
        def v2Sort = javax.imageio.ImageIO.read(v2SortSource)
        def v2SortOrder = javax.imageio.ImageIO.read(v2SortOrderSource)
        if (v2Sort == null || v2Sort.width != 32 || v2Sort.height != 48
                || v2SortOrder == null || v2SortOrder.width != 32 || v2SortOrder.height != 32) {
            throw new GradleException('v2 sorting source sheets changed size')
        }
        def sortButtonDefinitions = [
                [file: terminalSortButtons[0], source: v2Sort, sourceY: 0],
                [file: terminalSortButtons[1], source: v2Sort, sourceY: 16],
                [file: terminalSortButtons[2], source: v2SortOrder, sourceY: 0],
                [file: terminalSortButtons[3], source: v2SortOrder, sourceY: 16]
        ]
        def expectedSortButtonColors = (expectedTerminalButtonColors + [
                0xFFC3C2D0 as int, 0xFF7F7E8E as int
        ]) as Set
        sortButtonDefinitions.each { definition ->
            def image = javax.imageio.ImageIO.read(definition.file)
            if (image == null || image.width != 24 || image.height != 24
                    || !image.colorModel.hasAlpha()) {
                throw new GradleException(
                        "Terminal sort semantic must be a complete 24x24 RGBA texture: ${definition.file}")
            }
            def actualColors = new LinkedHashSet<Integer>()
            for (int y = 0; y < 24; y++) {
                for (int x = 0; x < 24; x++) {
                    int expected = terminalSortBase.getRGB(x, y)
                    if (x >= 4 && x < 20 && y >= 4 && y < 20) {
                        int icon = definition.source.getRGB(
                                x - 4, definition.sourceY + y - 4)
                        if ((icon >>> 24) != 0) expected = icon
                    }
                    int actual = image.getRGB(x, y)
                    if (actual != expected) {
                        throw new GradleException(
                                "Terminal sort semantic drifted from PR #133 + v2 sources at ${x},${y}: ${definition.file}")
                    }
                    actualColors.add(actual)
                }
            }
            if (actualColors != expectedSortButtonColors) {
                throw new GradleException(
                        "Terminal sort semantic palette changed: ${definition.file} ${actualColors}")
            }
        }
        [
                file('src/main/java/com/rtsbuilding/rtsbuilding/client/theme/PaletteTextureCatalog.java'),
                file('src/uiPreview/java/com/rtsbuilding/rtsbuilding/uipreview/UiMainlineAssets.java')
        ].each { sourceFile ->
            if (sourceFile.getText('UTF-8').contains('textures/gui/palette/')) {
                throw new GradleException(
                        "Palette must read original art, not a parallel texture: ${sourceFile}")
            }
        }
        String licenseText = assetLicenses.getText('UTF-8')
        if (!licenseText.contains('guide_*') || !licenseText.contains('textures/gui/guide/')) {
            throw new GradleException('UI icon source/license record is incomplete')
        }
        if (!licenseText.contains('colorwheel.png') || !licenseText.contains('怡然')) {
            throw new GradleException('v2 color-picker attribution is incomplete')
        }
        if (!licenseText.contains('terminal_sort_name.png')
                || !licenseText.contains('NeoForge-RTSBuildin-v2.0')) {
            throw new GradleException('v2 terminal sorting attribution is incomplete')
        }
        println "Verified ${topbarTextures.size()} top-bar states, ${guideTextures.size()} guide textures, " +
                "${pr133LegacyStates.size()} PR #133 Legacy states and " +
                "${pr133PaletteSources.size() + paletteTopbarSources.size()} Palette single sources"
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('uiCoreTest')
    dependsOn tasks.named('uiKitTest')
    dependsOn tasks.named('verifyUiSnapshots')
    dependsOn tasks.named('verifyUiBaselineResources')
    dependsOn tasks.named('verifyUiJava8Bytecode')
    dependsOn tasks.named('verifyUiDevModSources')
    dependsOn tasks.named('verifyUiStyleDebt')
    dependsOn tasks.named('verifyUiIconResources')
}

tasks.named('jar', Jar).configure {
    from sourceSets.uiCore.output
    from sourceSets.uiKit.output
}
