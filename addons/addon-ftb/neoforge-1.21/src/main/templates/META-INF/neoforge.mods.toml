modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
FTB Quests and FTB Teams integration for RTS Building mod.
Enables quest auto-detection and team-based progression sharing.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="[${minecraft_version}]"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="rtsbuilding"
    type="required"
    versionRange="[${mod_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ftbquests"
    type="optional"
    versionRange="[2100,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ftbteams"
    type="optional"
    versionRange="[2100,)"
    ordering="NONE"
    side="BOTH"
