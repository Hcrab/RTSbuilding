# GTNH ExampleMod 1.7.10 构建约定。这里先建立可复现的强搬基线，
# 玩家功能仍全部来自 1.12.2 成熟实现，不以删源码换取假编译通过。
gtnh.settings.blowdryerTag = 0.2.2

modName = RTS building Build From Above
modId = rtsbuilding
modGroup = com.rtsbuilding.rtsbuilding
useModGroupForPublishing = true
autoUpdateBuildScript = false

version = 0.0.1
customArchiveBaseName = rtsbuilding-forge-1.7.10

minecraftVersion = 1.7.10
forgeVersion = 10.13.4.1614
channel = stable
mappingsVersion = 12
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/
developmentEnvironmentUserName = Developer

# 用现代编译器处理机械搬运代码，产物仍是 GTNH 所需的 Java 8 字节码。
enableModernJavaSyntax = jabel
enableGenericInjection = true
generateGradleTokenClass = com.rtsbuilding.rtsbuilding.Tags
gradleTokenVersion = VERSION
replaceGradleTokenInFile =
apiPackage =
accessTransformersFile =

# 先让原有 mixin 源码进入首轮错误账本；随后改接 GTNH 的 UniMixins/IMixins。
usesMixins = true
separateMixinSourceSet =
usesMixinDebug = false
mixinPlugin =
mixinsPackage = mixin
coreModClass = bootstrap.RtsMixinConfigLoader
containsMixinsAndOrCoreModOnly = false
forceEnableMixins = false

usesShadowedDependencies = false
minimizeShadowedDependencies = true
relocateShadowedDependencies = true
includeWellKnownRepositories = true
excludeWellKnownRepositories =

usesMavenPublishing = false
modrinthProjectId =
curseForgeProjectId =

runClientWorkingDirectory = run/client
runServerWorkingDirectory = run/server

# 强搬阶段暂时禁用风格门禁；待 API 兼容层稳定后恢复。
disableSpotless = true
disableCheckstyle = true

# 大型源码树以稳定、可诊断为先，避免首轮并行编译掩盖根因。
org.gradle.jvmargs = -Xmx6G -Dfile.encoding=UTF-8
org.gradle.configuration-cache = false
org.gradle.parallel = false
