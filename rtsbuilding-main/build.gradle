plugins {
    id 'net.neoforged.moddev'
}

base {
    archivesName = providers.gradleProperty('mod_archive_name').getOrElse(mod_id)
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output',
                file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(project(':rtsbuilding-common').sourceSets.main)
            sourceSet(project(':rtsbuilding-api').sourceSets.main)
            sourceSet(project(':rtsbuilding-technologized').sourceSets.main)
            sourceSet(project(':rtsaddon-ae2').sourceSets.main)
            sourceSet(project(':rtsaddon-refinedstorage').sourceSets.main)
            sourceSet(project(':rtsaddon-beyonddimensions').sourceSets.main)
            sourceSet(project(':rtsaddon-sophisticatedbackpacks').sourceSets.main)
        }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
    additionalRuntimeClasspath.extendsFrom localRuntime
}

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
        }
    }
    test {
        java {
            srcDir 'src/test/java'
        }
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

dependencies {
    compileOnly project(':rtsbuilding-api')
    compileOnly project(':rtsbuilding-common')

    compileOnly "mezz.jei:jei-${jei_minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${jei_minecraft_version}-neoforge:${jei_version}"

    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"

    localRuntime "maven.modrinth:pipez:${pipez_version}"

    runtimeOnly fileTree(dir: 'libs', include: '*.jar')

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.0"
    testImplementation "org.mockito:mockito-core:5.12.0"
    testImplementation "org.mockito:mockito-junit-jupiter:5.12.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.0"
    testImplementation "net.neoforged:neoforge:${neo_version}"

    // common/api 仅以 compileOnly 提供给 main；测试运行时需要它们的类
    // （否则 AreaShapeTest/BlueprintFormatTest/RtsCountUtilTest 抛 NoClassDefFoundError）
    testImplementation project(':rtsbuilding-common')
    testImplementation project(':rtsbuilding-api')

    testImplementation 'org.openjdk.jmh:jmh-core:1.37'
    testAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'

    testImplementation 'org.xerial:sqlite-jdbc:3.46.0.0'
}

// ── Pinyin dictionary verification ──

tasks.register('verifyPinyinDictionary') {
    group = 'verification'
    description = 'Verify the bundled pinyin dictionary resource exists before packaging.'

    def dict = file('src/main/resources/assets/rtsbuilding/pinyin/data.txt')
    inputs.file(dict)

    doLast {
        if (!dict.isFile()) {
            throw new GradleException("Missing pinyin dictionary: ${dict}")
        }
        if (dict.length() < 250_000L) {
            throw new GradleException("Pinyin dictionary looks truncated: ${dict.length()} bytes")
        }
    }
}

tasks.named('processResources').configure {
    dependsOn tasks.named('verifyPinyinDictionary')
}

// ── Mod metadata generation ──

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_credits            : mod_credits,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// ── Test task ──

tasks.named('test', Test).configure {
    useJUnitPlatform()
    exclude '**/server/benchmark/**'
    exclude '**/server/history/**'
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}

// ── Publishing ──

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// ── Jar ──

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_archive_name}-${mod_version}.jar"
    from project(':rtsbuilding-common').sourceSets.main.output
    from project(':rtsbuilding-api').sourceSets.main.output
    from project(':rtsbuilding-technologized').sourceSets.main.output
    from project(':rtsaddon-ae2').sourceSets.main.output
    from project(':rtsaddon-refinedstorage').sourceSets.main.output
    from project(':rtsaddon-beyonddimensions').sourceSets.main.output
    from project(':rtsaddon-sophisticatedbackpacks').sourceSets.main.output
}

