/*
 * RFG 会把当前 Gradle user home 下的原版 client.jar 放入这个稳定缓存路径。
 * 这里只在执行离屏任务时解析，不把某个开发者机器的绝对路径写进仓库；缺少资源时必须明确失败，
 * 绝不能退回操作系统字体。
 */
def resolveRfgClientJar = {
    def cachePath = 'caches/retro_futura_gradle/mc-vanilla/1.12.2/client.jar'
    def candidates = [
            new File(gradle.gradleUserHomeDir, cachePath),
            file(".gradle-user-home/${cachePath}")
    ]
    def clientJar = candidates.find { candidate -> candidate.isFile() }
    if (clientJar == null) {
        throw new GradleException('Missing RFG 1.12.2 client.jar for headless UI preview. '
                + 'Run the RFG setup first or configure Gradle with the shared cache containing '
                + cachePath)
    }
    return clientJar
}

def attachLegacyPreviewFont = { JavaExec task ->
    task.doFirst {
        def clientJar = resolveRfgClientJar()
        task.systemProperty 'rts.uipreview.minecraftClientJar', clientJar.absolutePath
    }
}

