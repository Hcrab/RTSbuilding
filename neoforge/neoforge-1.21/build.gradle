plugins {
    id 'net.neoforged.moddev'
}

base {
    archivesName = providers.gradleProperty('mod_archive_name').getOrElse(mod_id)
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output',
                file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(project(':common').sourceSets.main)
            sourceSet(project(':rtsbuilding-api').sourceSets.main)
        }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
    additionalRuntimeClasspath.extendsFrom localRuntime
}

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
        }
    }
    test {
        java {
            srcDir 'src/test/java'
        }
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

dependencies {
    compileOnly project(':rtsbuilding-api')
    compileOnly project(':common')

    // Addon mods for dev environment
    runtimeOnly project(':addon-ae2')
    runtimeOnly project(':addon-refinedstorage')
    runtimeOnly project(':addon-beyonddimensions')
    runtimeOnly project(':addon-sophisticatedbackpacks')
    runtimeOnly project(':addon-ftb')

    compileOnly "mezz.jei:jei-${jei_minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${jei_minecraft_version}-neoforge:${jei_version}"

    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"

    localRuntime "maven.modrinth:pipez:${pipez_version}"

    runtimeOnly fileTree(dir: 'libs', include: '*.jar')

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.0"
    testImplementation "org.mockito:mockito-core:5.12.0"
    testImplementation "org.mockito:mockito-junit-jupiter:5.12.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.0"
    testImplementation "net.neoforged:neoforge:${neo_version}"

    testImplementation 'org.openjdk.jmh:jmh-core:1.37'
    testAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'

    testImplementation 'org.xerial:sqlite-jdbc:3.46.0.0'
}

// ── Pinyin dictionary verification ──

tasks.register('verifyPinyinDictionary') {
    group = 'verification'
    description = 'Verify the bundled pinyin dictionary resource exists before packaging.'

    def dict = file('src/main/resources/assets/rtsbuilding/pinyin/data.txt')
    inputs.file(dict)

    doLast {
        if (!dict.isFile()) {
            throw new GradleException("Missing pinyin dictionary: ${dict}")
        }
        if (dict.length() < 250_000L) {
            throw new GradleException("Pinyin dictionary looks truncated: ${dict.length()} bytes")
        }
    }
}

tasks.named('processResources').configure {
    dependsOn tasks.named('verifyPinyinDictionary')
}

// ── Mod metadata generation ──

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_credits            : mod_credits,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// ── Test task ──

tasks.named('test', Test).configure {
    useJUnitPlatform()
    exclude '**/server/benchmark/**'
    exclude '**/server/history/**'
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}

// ── Benchmark tasks ──

tasks.register('generateBenchmarkReport') {
    group = 'benchmark'
    description = 'Run extreme performance benchmarks and generate benchmark-results.txt'
    dependsOn 'cleanTest'
    doLast {
        println 'Running Benchmark tests...'
    }
    finalizedBy 'runBenchmarks'
}

tasks.register('runBenchmarks', Test) {
    group = 'benchmark'
    description = 'Internal task — run benchmark tests'
    useJUnitPlatform()

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    filter {
        includeTestsMatching '*JmhBenchmarkRunner'
    }
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
    outputs.upToDateWhen { false }
}

tasks.register('startBenchmarkServer', JavaExec) {
    group = 'benchmark'
    description = 'Start the Benchmark data HTTP server'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.rtsbuilding.rtsbuilding.server.benchmark.infrastructure.BenchmarkServer'
}

tasks.register('resetBenchmarkData', JavaExec) {
    group = 'benchmark'
    description = 'Delete ALL benchmark data from the SQLite database'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.rtsbuilding.rtsbuilding.server.benchmark.infrastructure.BenchmarkDatabase'
    args 'reset'
}

tasks.register('generateSkeletonVisualReport', JavaExec) {
    group = 'verification'
    description = 'Generate a local HTML report for merged skeleton stress scenes'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.rtsbuilding.rtsbuilding.client.rendering.builder.SkeletonVisualReport'
}

// ── Publishing ──

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// ── Jar ──

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_archive_name}-${mod_version}.jar"
    from project(':common').sourceSets.main.output
    from project(':rtsbuilding-api').sourceSets.main.output
}

// ── Build standalone addon JARs ──

tasks.register('buildAddonJars') {
    group = 'development'
    description = 'Build standalone addon mod JARs for production use'
    dependsOn project(':addon-ae2').tasks.named('jar')
    dependsOn project(':addon-refinedstorage').tasks.named('jar')
    dependsOn project(':addon-beyonddimensions').tasks.named('jar')
    dependsOn project(':addon-sophisticatedbackpacks').tasks.named('jar')
    dependsOn project(':addon-ftb').tasks.named('jar')
    doLast {
        println 'Addon JARs built — find them in each addon\\neoforge-1.21\\build\\libs\\ directory'
    }
}
