name: Publish Modrinth prerelease

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Immutable release tag to build
        required: true
        type: string
      minecraft_version:
        description: Exact Minecraft version
        required: true
        type: choice
        options:
          - 1.12.2
          - 1.21.1
          - 26.1.2
      version:
        description: Exact RTSBuilding version
        required: true
        type: string
      version_type:
        description: Modrinth release channel
        required: true
        type: choice
        options:
          - beta
          - alpha
      changelog_base64:
        description: UTF-8 release notes encoded as Base64
        required: true
        type: string
      repair_version_id:
        description: Existing Modrinth version ID to repair without republishing
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: publish-modrinth-${{ inputs.minecraft_version }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.source_ref }}

      - name: Select toolchain and artifact
        id: release
        shell: bash
        env:
          MINECRAFT_VERSION: ${{ inputs.minecraft_version }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          read_property() {
            sed -nE "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*(.*)$/\\1/p" gradle.properties \
              | tail -n 1 \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }
          actual_minecraft="$(read_property minecraft_version)"
          if [ -z "$actual_minecraft" ]; then
            actual_minecraft="$(sed -nE \
              "s/^[[:space:]]*mcVersion\\.set\\('([^']+)'\\).*$/\\1/p" \
              build.gradle | head -n 1)"
          fi
          actual_version="$(read_property mod_version)"
          test "$actual_minecraft" = "$MINECRAFT_VERSION"
          test "$actual_version" = "$RELEASE_VERSION"
          case "$MINECRAFT_VERSION" in
            1.12.2)
              echo "java_version=21" >> "$GITHUB_OUTPUT"
              echo "java_release=8" >> "$GITHUB_OUTPUT"
              echo "loader=forge" >> "$GITHUB_OUTPUT"
              echo "display_loader=Forge" >> "$GITHUB_OUTPUT"
              echo "dependencies=mixinbooter(required){modrinth:G1ckZuWK}" >> "$GITHUB_OUTPUT"
              echo "artifact=build/libs/rtsbuilding-${RELEASE_VERSION}.jar" >> "$GITHUB_OUTPUT"
              ;;
            1.21.1)
              echo "java_version=21" >> "$GITHUB_OUTPUT"
              echo "java_release=21" >> "$GITHUB_OUTPUT"
              echo "loader=neoforge" >> "$GITHUB_OUTPUT"
              echo "display_loader=NeoForge" >> "$GITHUB_OUTPUT"
              echo "artifact=build/libs/rtsbuilding-neoforge-1.21.1-${RELEASE_VERSION}.jar" >> "$GITHUB_OUTPUT"
              ;;
            26.1.2)
              echo "java_version=25" >> "$GITHUB_OUTPUT"
              echo "java_release=25" >> "$GITHUB_OUTPUT"
              echo "loader=neoforge" >> "$GITHUB_OUTPUT"
              echo "display_loader=NeoForge" >> "$GITHUB_OUTPUT"
              echo "artifact=build/libs/rtsbuilding-neoforge-26.1.2-${RELEASE_VERSION}.jar" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported Minecraft version: $MINECRAFT_VERSION" >&2
              exit 1
              ;;
          esac

      - name: Set up Java
        if: inputs.repair_version_id == ''
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: ${{ steps.release.outputs.java_version }}
          cache: gradle

      - name: Build and verify exact artifact
        if: inputs.repair_version_id == ''
        shell: bash
        env:
          ARTIFACT: ${{ steps.release.outputs.artifact }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew build --no-daemon --no-configuration-cache
          test -f "$ARTIFACT"

      - name: Decode release notes
        shell: bash
        env:
          CHANGELOG_BASE64: ${{ inputs.changelog_base64 }}
        run: |
          set -euo pipefail
          printf '%s' "$CHANGELOG_BASE64" | base64 --decode > release-notes.md
          test -s release-notes.md

      - name: Publish to Modrinth
        if: inputs.repair_version_id == ''
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          modrinth-id: 5PkY7RJI
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.release.outputs.artifact }}
          name: RTS Building ${{ inputs.version }} for ${{ steps.release.outputs.display_loader }} ${{ inputs.minecraft_version }}
          version: ${{ inputs.version }}
          version-type: ${{ inputs.version_type }}
          changelog-file: release-notes.md
          loaders: ${{ steps.release.outputs.loader }}
          game-versions: ${{ inputs.minecraft_version }}
          game-version-filter: none
          environment: client | server
          java: ${{ steps.release.outputs.java_release }}
          dependencies: ${{ steps.release.outputs.dependencies }}
          retry-attempts: 3
          retry-delay: 10000

      - name: Normalize Modrinth changelog encoding
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          REQUESTED_VERSION_ID: ${{ inputs.repair_version_id }}
        run: |
          set -euo pipefail
          api='https://api.modrinth.com/v2'
          user_agent='RTSBuilding-release-workflow/1.0 (github.com/Hcrab/RTSbuilding)'
          version_id="$REQUESTED_VERSION_ID"
          if [ -z "$version_id" ]; then
            versions_json="$(curl --fail-with-body --silent --show-error \
              -H "User-Agent: $user_agent" \
              "$api/project/5PkY7RJI/version")"
            version_id="$(printf '%s' "$versions_json" | jq -r \
              --arg version "$RELEASE_VERSION" \
              '[.[] | select(.version_number == $version)] | if length == 1 then .[0].id else empty end')"
            test -n "$version_id"
          fi

          version_json="$(curl --fail-with-body --silent --show-error \
            -H "User-Agent: $user_agent" \
            "$api/version/$version_id")"
          test "$(printf '%s' "$version_json" | jq -r '.project_id')" = '5PkY7RJI'
          test "$(printf '%s' "$version_json" | jq -r '.version_number')" = "$RELEASE_VERSION"

          jq -n --rawfile changelog release-notes.md '{changelog: $changelog}' > modrinth-changelog.json
          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "User-Agent: $user_agent" \
            -H 'Content-Type: application/json' \
            --data-binary @modrinth-changelog.json \
            "$api/version/$version_id" > /dev/null
