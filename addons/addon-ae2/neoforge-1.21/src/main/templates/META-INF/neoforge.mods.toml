    type="required"
    versionRange="[${minecraft_version}]"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="rtsbuilding"
    type="required"
    versionRange="[${mod_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
