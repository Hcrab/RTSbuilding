name: Publish Fabric alpha

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Immutable Fabric source tag to build
        required: true
        type: string
      version:
        description: Exact Fabric mod version
        required: true
        type: string
      publish_modrinth:
        description: Publish to Modrinth
        required: true
        default: true
        type: boolean
      publish_curseforge:
        description: Publish to CurseForge
        required: true
        default: true
        type: boolean
      changelog_base64:
        description: UTF-8 release notes encoded as Base64
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-fabric-alpha-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish-fabric:
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable Fabric source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Java 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Fabric release identity and build
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          actual_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          minecraft_version="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          test "$actual_version" = "$RELEASE_VERSION"
          test "$minecraft_version" = "1.21.1"
          case "$RELEASE_VERSION" in
            *fabric-alpha*) ;;
            *) echo "Refusing to publish a non-Fabric-Alpha version" >&2; exit 1 ;;
          esac
          chmod +x gradlew
          ./gradlew build --no-daemon --no-configuration-cache
          test -f "build/libs/rtsbuilding-fabric-1.21.1-${RELEASE_VERSION}.jar"

      - name: Decode and validate release notes
        shell: bash
        env:
          CHANGELOG_BASE64: ${{ inputs.changelog_base64 }}
        run: |
          set -euo pipefail
          printf '%s' "$CHANGELOG_BASE64" | base64 --decode > release-notes.md
          python3 - <<'PY'
          from pathlib import Path

          text = Path("release-notes.md").read_text(encoding="utf-8")
          required = (
              "## 简体中文",
              "这是不稳定的 Alpha 测试版",
              "备份存档",
              "## English",
              "This is an unstable Alpha build",
              "Back up your worlds",
          )
          missing = [marker for marker in required if marker not in text]
          if missing or "\ufffd" in text:
              raise SystemExit(f"Release notes failed validation; missing={missing!r}")
          PY

      - name: Publish Fabric 1.21.1 Alpha to Modrinth
        if: inputs.publish_modrinth
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          modrinth-id: 5PkY7RJI
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/rtsbuilding-fabric-1.21.1-${{ inputs.version }}.jar
          name: RTS Building ${{ inputs.version }} for Fabric 1.21.1
          version: ${{ inputs.version }}
          version-type: alpha
          changelog-file: release-notes.md
          loaders: fabric
          game-versions: 1.21.1
          game-version-filter: none
          environment: client | server
          java: 21
          retry-attempts: 3
          retry-delay: 10000

      - name: Publish Fabric 1.21.1 Alpha to CurseForge
        if: inputs.publish_curseforge
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: 1553142
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/rtsbuilding-fabric-1.21.1-${{ inputs.version }}.jar
          name: RTS Building ${{ inputs.version }} for Fabric 1.21.1
          version: ${{ inputs.version }}
          version-type: alpha
          changelog-file: release-notes.md
          loaders: fabric
          game-versions: 1.21.1
          game-version-filter: none
          environment: client | server
          java: 21
          retry-attempts: 3
          retry-delay: 10000
